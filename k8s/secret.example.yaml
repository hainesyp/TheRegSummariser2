# Template only - do NOT commit a copy of this with real values filled in.
#
# Preferred approach: create the secret imperatively so the key never touches disk/git history:
#   kubectl create secret generic register-summary-secrets \
#     --namespace register-summary \
#     --from-literal=Ai__OpenAI__ApiKey='sk-...' \
#     --from-literal=Ai__Gemini__ApiKey='' \
#     --from-literal=Ai__Claude__ApiKey=''
#
# Only the API key for the provider set in configmap.yaml's Ai__Provider needs a real value;
# the others can be left empty.
apiVersion: v1
kind: Secret
metadata:
  name: register-summary-secrets
  namespace: register-summary
type: Opaque
stringData:
  Ai__OpenAI__ApiKey: "REPLACE_ME"
  Ai__Gemini__ApiKey: "REPLACE_ME"
  Ai__Claude__ApiKey: "REPLACE_ME"
